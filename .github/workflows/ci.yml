name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: forge build --sizes
      - name: Deploy-page artifacts match a fresh build
        run: ./scripts/export_artifacts.sh && git diff --exit-code site/artifacts
      - name: Test
        run: forge test -vv
      - name: update_feed.py encoder matches cast
        run: python3 scripts/update_feed.py --self-test
      - name: End-to-end demo (local anvil)
        run: ./scripts/demo.sh
